<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a class="again-btn" href="#">Restart !</a>
      <h1 class="h1 title">Rock, Paper & Scissor</h1>
      <div class="scorecard">
        <div class="score won">
          <p class="result">Won</p>
          <p class="count-win">0</p>
        </div>
        <div class="score draw">
          <p class="result">Draw</p>
          <p class="count-draw">0</p>
        </div>
        <div class="score lose">
          <p class="result">Lose</p>
          <p class="count-lose">0</p>
        </div>
      </div>
    </nav>
    <section class="game-play">
      <div class="show">
        <div class="user">
          <h2 class="h2">You</h2>
          <img src="images/rock1.png" alt="rock" class="show-img show1" />
        </div>
        <div class="versus">VS</div>
        <div class="computer">
          <h2 class="h2">Computer</h2>
          <img src="images/rock2.png" alt="rock" class="show-img show2" />
        </div>
      </div>
    </section>
    <section class="main-game">
      <div class="message"><p class="txt">Choose any !!!</p></div>
      <div class="choose">
        <div class="rock choose-i">
          <img src="images/rock1.png" alt="rock" class="choose-img" />
        </div>
        <div class="paper choose-i">
          <img src="images/paper1.png" alt="paper" class="choose-img" />
        </div>
        <div class="scissor choose-i">
          <img
            src="images/scissor1.png"
            alt="scissor"
            class="choose-img long-sci"
          />
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
